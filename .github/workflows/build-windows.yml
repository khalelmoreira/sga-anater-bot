name: Build Windows app

# Manual only (see docs/build-exe.md). Builds the PyInstaller app on a Windows
# runner and uploads the zip as an artifact. No tests or --selftest here: the
# Windows VM runs --selftest on the downloaded exe.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python packaging/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: SGA-ANATER-Bot-windows
          path: dist/SGA-ANATER-Bot.zip
