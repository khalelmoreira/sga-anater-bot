name: Build Windows app

# Manual only. Builds the PyInstaller app on Windows, runs its self-test and
# uploads the zip as an artifact.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller
      - run: python -m tests.test_pipeline
      - run: python -m tests.test_web
      - run: python packaging/build.py
      - name: Self-test the packaged app
        run: dist\SGA-ANATER-Bot\SGA-ANATER-Bot.exe --selftest
      - uses: actions/upload-artifact@v4
        with:
          name: SGA-ANATER-Bot-windows
          path: dist/SGA-ANATER-Bot.zip
